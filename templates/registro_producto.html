<!doctype html>

<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro Producto</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
     <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <span class="navbar-brand">
                <i class="bi bi-cpu"></i>
                TECHSTORE | Panel Administrador
            </span>

            <a href="/logout" class="btn btn-outline-light">
                <i class="bi bi-box-arrow-right"></i>
                Cerrar sesión
            </a>

        </div>
    </nav>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow">
            <div class="card-header bg-dark text-white">
              <h3 class="text-center">Registro de Productos</h3>
            </div>
            <div class="card-body">
              {% with mensajes = get_flashed_messages(with_categories=true) %}
              {% if mensajes %} {% for categoria, mensaje in mensajes %}
              <div
                class="alert alert-{{ 'danger' if categoria == 'error' else 'success' }}"
              >
                {{ mensaje }}
              </div>
              {% endfor %} {% endif %} {% endwith %}
              <form action="/guardar_producto" method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                  <label class="form-label"> Código </label>
                  <input
                    type="text"
                    name="codigo"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label"> Nombre </label>
                  <input
                    type="text"
                    name="nombre"
                    class="form-control"
                    minlength="3"
                    maxlength="50"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label">Imagen</label>
                  <input
                    type="file"
                    name="imagen"
                    class="form-control"
                    accept="image/*"
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label"> Precio </label>
                  <input
                    type="number"
                    name="precio"
                    class="form-control"
                    min="1"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label"> Categoría </label>
                  <input
                    type="text"
                    name="categoria"
                    class="form-control"
                    required
                  />
                </div>

                <button class="btn btn-primary w-100">Guardar Producto</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
